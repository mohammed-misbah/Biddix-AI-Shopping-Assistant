<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Biddix Product Concierge</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body class="biddix-preview">

    <!-- Only the concierge interface. No storefront content. -->
    <div id="biddix-app"></div>


    <!-- =====================================================
         CONFIG
    ====================================================== -->

    <script>
        window.BIDDIX_CONFIG = {
            mode: 'live',

            openOnLoad: true,

            endpoint:
                'http://127.0.0.1:8000/api/v1/chat',

            currentProduct: null
        };
    </script>


    <!-- =====================================================
         BIDDIX CHAT
    ====================================================== -->

    <script>
    (function () {

        "use strict";


        /* =====================================================
           CATALOGUE
        ====================================================== */

        const products = [

            {
                id: 'UAE-001',
                name: 'The Falcon',
                subtitle: 'UAE Heritage Collection',
                year: 2024,
                material: 'Silver',
                weight: '31.1 g',
                purity: '999',
                price: 465,
                stock: 'Available',
                edition: '1,000 pieces',
                kind: 'falcon'
            },

            {
                id: 'UAE-002',
                name: 'The Palm',
                subtitle: 'Emirates Gold Collection',
                year: 2024,
                material: 'Gold',
                weight: '7.78 g',
                purity: '999.9',
                price: 2450,
                stock: 'Low availability',
                edition: '500 pieces',
                kind: 'palm'
            },

            {
                id: 'UAE-003',
                name: 'Desert Oryx',
                subtitle: 'UAE Wildlife Collection',
                year: 2023,
                material: 'Silver',
                weight: '28 g',
                purity: '999',
                price: 395,
                stock: 'Available',
                edition: '2,000 pieces',
                kind: 'oryx'
            },

            {
                id: 'UAE-004',
                name: 'A Golden Jubilee',
                subtitle: 'Commemorative Collection',
                year: 2021,
                material: 'Silver',
                weight: '31.1 g',
                purity: '999',
                price: 520,
                stock: 'Available',
                edition: '2,021 pieces',
                kind: 'jubilee'
            }

        ];


        const getProduct = id =>
            products.find(
                product =>
                    product.id === id
            );


        const money = value =>
            `AED ${Number(value).toLocaleString('en-AE')}`;



        /* =====================================================
           COMPONENT HELPERS
        ====================================================== */

        const escapeHTML = value =>
            String(value ?? '')
                .replace(
                    /[&<>"']/g,
                    character => ({
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    }[character])
                );


        const arrow =
            '<span aria-hidden="true">↗</span>';



        /* =====================================================
           SMALL INLINE COIN IMAGE

           Your original file had ~3.9MB Base64 image data here.
           This lightweight SVG keeps chat.html manageable.
        ====================================================== */

        const coinImage =
            'data:image/svg+xml;charset=UTF-8,' +
            encodeURIComponent(`
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 300 300"
                >
                    <defs>
                        <radialGradient
                            id="coin"
                            cx="35%"
                            cy="30%"
                            r="75%"
                        >
                            <stop
                                offset="0%"
                                stop-color="#f5f5f2"
                            />

                            <stop
                                offset="55%"
                                stop-color="#c8c8c2"
                            />

                            <stop
                                offset="100%"
                                stop-color="#8f8f89"
                            />
                        </radialGradient>
                    </defs>

                    <circle
                        cx="150"
                        cy="150"
                        r="135"
                        fill="url(#coin)"
                    />

                    <circle
                        cx="150"
                        cy="150"
                        r="116"
                        fill="none"
                        stroke="#666"
                        stroke-width="3"
                    />

                    <text
                        x="150"
                        y="174"
                        text-anchor="middle"
                        font-family="Georgia, serif"
                        font-size="82"
                        fill="#222"
                    >
                        B
                    </text>
                </svg>
            `);



        const Coin = (
            product,
            className = ''
        ) => `
            <div
                class="bx-coin-photo
                    ${escapeHTML(product.kind || 'falcon')}
                    ${escapeHTML(className)}"
            >
                <img
                    src="${coinImage}"
                    alt="${escapeHTML(product.name || 'Biddix coin')}"
                >
            </div>
        `;



        const ProductResult = product => `
            <article class="bx-result">

                ${Coin(product)}

                <div>

                    <span class="bx-eyebrow">
                        ${escapeHTML(product.year)}
                        ·
                        ${escapeHTML(product.material)}
                    </span>

                    <h3>
                        ${escapeHTML(product.name)}
                    </h3>

                    <p>
                        ${escapeHTML(product.weight)}
                        ·
                        ${escapeHTML(product.purity)}
                        purity
                    </p>

                    <strong>
                        ${money(product.price)}
                    </strong>

                    <span class="bx-availability">
                        ${escapeHTML(
                            product.stock ||
                            'Availability unconfirmed'
                        )}
                    </span>

                    <button
                        type="button"
                        class="bx-text-link"
                        data-product="${escapeHTML(product.id)}"
                    >
                        View piece ${arrow}
                    </button>

                </div>

            </article>
        `;



        const FeedbackControl = () => `
            <div class="bx-feedback">

                Helpful?

                <button
                    type="button"
                    data-feedback="Yes"
                >
                    Yes
                </button>

                <span>·</span>

                <button
                    type="button"
                    data-feedback="No"
                >
                    No
                </button>

            </div>
        `;



        const ProductComparison = productList => `
            <div class="bx-comparison">

                <div class="bx-compare-images">

                    <div></div>

                    ${
                        productList.map(
                            product => `
                                <div>
                                    ${Coin(product)}

                                    <strong>
                                        ${escapeHTML(product.name)}
                                    </strong>
                                </div>
                            `
                        ).join('')
                    }

                </div>


                <table>

                    <caption class="bx-sr">
                        Coin specifications comparison
                    </caption>


                    <thead>
                        <tr>

                            <th>
                                Specification
                            </th>

                            ${
                                productList.map(
                                    product => `
                                        <th>
                                            ${escapeHTML(product.name)}
                                        </th>
                                    `
                                ).join('')
                            }

                        </tr>
                    </thead>


                    <tbody>

                        ${
                            [
                                ['Year', 'year'],
                                ['Material', 'material'],
                                ['Weight', 'weight'],
                                ['Purity', 'purity'],
                                ['Price', 'price']
                            ]
                            .map(
                                ([title, key]) => `
                                    <tr>

                                        <th scope="row">
                                            ${title}
                                        </th>

                                        ${
                                            productList.map(
                                                product => `
                                                    <td>
                                                        ${
                                                            key === 'price'
                                                                ? money(product[key])
                                                                : escapeHTML(product[key])
                                                        }
                                                    </td>
                                                `
                                            ).join('')
                                        }

                                    </tr>
                                `
                            )
                            .join('')
                        }

                    </tbody>

                </table>

            </div>
        `;



        const SuggestedQueries = (
            context = false
        ) => {

            const queries =
                context
                    ? [
                        'Is this suitable as a gift?',
                        "What's the purity?",
                        'Compare with another silver piece'
                    ]
                    : [
                        'Explore UAE coins',
                        'Find silver under AED 500',
                        'Compare two pieces',
                        'Looking for a gift',
                        'Recently added'
                    ];


            return `
                <div class="bx-suggestions">

                    ${
                        queries.map(
                            (query, index) => `
                                <button
                                    type="button"
                                    data-query="${escapeHTML(query)}"
                                >
                                    <span class="bx-index">
                                        0${index + 1}
                                    </span>

                                    ${escapeHTML(query)}

                                    <span aria-hidden="true">
                                        ↗
                                    </span>
                                </button>
                            `
                        ).join('')
                    }

                </div>
            `;
        };



        const CurrentProductContext =
            product => `
                <div class="bx-context">

                    ${Coin(product)}

                    <div>

                        <span class="bx-eyebrow">
                            Currently viewing
                        </span>

                        <strong>
                            ${escapeHTML(product.year)}
                            ${escapeHTML(product.name)}
                        </strong>

                    </div>

                    <button
                        type="button"
                        data-action="clear-context"
                        aria-label="Remove current product context"
                    >
                        ×
                    </button>

                </div>
            `;



        const Welcome = context => `
            <section class="bx-welcome">

                <div
                    class="bx-welcome-mark"
                    aria-hidden="true"
                >
                    ✳
                </div>

                <span class="bx-eyebrow">
                    A considered collection.
                    A personal touch.
                </span>

                <h2>
                    Find the<br>
                    right piece<span>.</span>
                </h2>

                <p>
                    Every coin has a story.
                    Let’s find yours.
                    <br>

                    Explore the collection,
                    look a little closer,
                    <br>

                    or discover something unexpected.
                </p>

                <div class="bx-section-label">
                    ${
                        context
                            ? 'A closer look'
                            : 'Where would you like to begin?'
                    }
                </div>

                ${SuggestedQueries(context)}

                <div class="bx-service-note">

                    <span aria-hidden="true">
                        ◇
                    </span>

                    <p>
                        From a first find to a prized addition.
                        <br>

                        Thoughtful guidance,
                        at your pace.
                    </p>

                </div>

            </section>
        `;



        const CustomerMessage =
            text => `
                <div class="bx-customer">

                    <span class="bx-eyebrow">
                        You
                    </span>

                    <p>
                        ${escapeHTML(text)}
                    </p>

                </div>
            `;



        const ConciergeResponse =
            message => `
                <section class="bx-response">

                    <span class="bx-eyebrow">
                        Biddix Concierge
                    </span>

                    <p>
                        ${escapeHTML(message.answer)}
                    </p>

                    ${
                        message.comparison
                            ? ProductComparison(
                                message.products || []
                            )
                            : (
                                message.products
                                    ?.map(ProductResult)
                                    .join('')
                                ||
                                ''
                            )
                    }

                    ${
                        message.recommendation
                            ? `
                                <p class="bx-recommendation">
                                    ${
                                        escapeHTML(
                                            message.recommendation
                                        )
                                    }
                                </p>
                            `
                            : ''
                    }

                    ${
                        message.empty
                            ? `
                                <div class="bx-empty">

                                    <span>
                                        Nothing quite matches.
                                        Yet.
                                    </span>

                                    <p>
                                        Try another material
                                        or a wider price range.
                                    </p>

                                    <button
                                        type="button"
                                        class="bx-text-link"
                                        data-query="Explore UAE coins"
                                    >
                                        Explore the collection ↗
                                    </button>

                                </div>
                            `
                            : ''
                    }

                    ${FeedbackControl()}

                </section>
            `;



        const LoadingState = () => `
            <div
                class="bx-loading"
                role="status"
            >

                <span>
                    Consulting the collection
                </span>

                <div></div>

            </div>
        `;



        const ErrorState = () => `
            <div
                class="bx-error"
                role="alert"
            >

                <span class="bx-eyebrow">
                    A brief pause
                </span>

                <p>
                    I couldn't retrieve the collection
                    information just now.
                    Please try again in a moment.
                </p>

                <button
                    type="button"
                    class="bx-text-link"
                    data-action="retry"
                >
                    Try again ↗
                </button>

            </div>
        `;



        /* =====================================================
           API
        ====================================================== */

        async function sendMessage({
            message,
            sessionId,
            currentProduct,
            onChunk,
            signal
        }) {

            /* ===============================================
               LIVE MODE
            =============================================== */

            if (
                window.BIDDIX_CONFIG?.mode ===
                'live'
            ) {

                const endpoint =
                    window.BIDDIX_CONFIG.endpoint ||
                    '/api/v1/chat';


                const payload = {

                    message,

                    current_product_id:
                        currentProduct?.id ||
                        null
                };


                /*
                 * Redis session exists?
                 *
                 * Send its identifier.
                 *
                 * No identifier on first message =
                 * backend creates new Redis session.
                 */

                if (
                    typeof sessionId === 'string' &&
                    sessionId.trim() !== ''
                ) {

                    payload.session_id =
                        sessionId.trim();
                }


                let response;


                try {

                    response =
                        await fetch(
                            endpoint,
                            {
                                method: 'POST',

                                headers: {
                                    'Content-Type':
                                        'application/json'
                                },

                                body:
                                    JSON.stringify(
                                        payload
                                    ),

                                signal
                            }
                        );

                }

                catch (error) {

                    if (
                        error?.name ===
                        'AbortError'
                    ) {

                        throw error;
                    }


                    throw new Error(
                        'Unable to connect to the concierge service.'
                    );
                }



                let data;


                try {

                    data =
                        await response.json();

                }

                catch {

                    throw new Error(
                        'The server returned invalid JSON.'
                    );
                }



                if (!response.ok) {

                    throw new Error(
                        data?.detail ||
                        data?.error ||
                        data?.message ||
                        'Collection unavailable.'
                    );
                }



                if (
                    !data ||
                    typeof data.answer !==
                        'string'
                ) {

                    throw new Error(
                        'Invalid chat response.'
                    );
                }



                /*
                 * IMPORTANT SESSION HANDLING
                 *
                 * Backend should normally return session_id.
                 *
                 * If it doesn't return one on an existing
                 * conversation, keep the current identifier
                 * instead of destroying it.
                 */

                const returnedSessionId =
                    (
                        typeof data.session_id ===
                            'string' &&
                        data.session_id.trim() !== ''
                    )
                    ? data.session_id.trim()
                    : null;



                const existingSessionId =
                    (
                        typeof sessionId ===
                            'string' &&
                        sessionId.trim() !== ''
                    )
                    ? sessionId.trim()
                    : null;



                const resolvedSessionId =
                    returnedSessionId ||
                    existingSessionId;



                /*
                 * First request absolutely needs an ID
                 * from the backend.
                 */

                if (!resolvedSessionId) {

                    throw new Error(
                        'Backend did not return session_id.'
                    );
                }



                const normalizedProducts =
                    Array.isArray(data.products)
                        ? data.products.map(
                            product => ({
                                ...product,

                                id:
                                    product.product_id ||
                                    product.id,

                                name:
                                    product.name ||
                                    'Unnamed product',

                                stock:
                                    product.stock ||
                                    'Availability unconfirmed'
                            })
                        )
                        : [];



                return {

                    ...data,

                    session_id:
                        resolvedSessionId,

                    products:
                        normalizedProducts
                };
            }



            /* ===============================================
               DEMO MODE
            =============================================== */

            await new Promise(
                (resolve, reject) => {

                    const timer =
                        setTimeout(
                            resolve,
                            950
                        );


                    signal?.addEventListener(
                        'abort',
                        () => {

                            clearTimeout(
                                timer
                            );


                            reject(
                                new DOMException(
                                    'Aborted',
                                    'AbortError'
                                )
                            );

                        },
                        {
                            once: true
                        }
                    );
                }
            );



            const q =
                message.toLowerCase();


            const context =
                currentProduct;


            let ps = [];

            let answer = '';

            let comparison =
                false;

            let recommendation =
                '';

            let empty =
                false;



            if (
                q.includes('error') ||
                q.includes('unavailable')
            ) {

                throw new Error(
                    'Demo error'
                );
            }



            if (
                q.includes('compare')
            ) {

                ps = [
                    context || products[0],
                    products[2]
                ];


                if (
                    ps[0].id ===
                    ps[1].id
                ) {

                    ps[1] =
                        products[3];
                }


                comparison =
                    true;


                answer =
                    'Two pieces, two different stories. Here’s how the details compare.';


                recommendation =
                    'For a first collectible, Desert Oryx offers a lower entry price. The Falcon has a larger silver weight and a smaller edition.';

            }


            else if (
                context &&
                /purity|weight|year|edition|specification/.test(
                    q
                )
            ) {

                answer =
                    `${context.name} is ` +
                    `${context.purity} purity ` +
                    `${context.material.toLowerCase()}, ` +
                    `weighing ${context.weight}. ` +
                    `This ${context.year} edition is ` +
                    `limited to ${context.edition} ` +
                    `in our sample collection.`;

            }


            else if (
                /gift/.test(q)
            ) {

                ps = [
                    context ||
                    products[0]
                ];


                answer =
                    'A meaningful piece to mark a moment. The Falcon is a considered starting point for a gift, with a design rooted in UAE heritage.';


                recommendation =
                    'Gift packaging and delivery details should be confirmed with the store before ordering.';

            }


            else if (
                /coin|silver|gold|uae|collection|recent|under|piece|budget/.test(
                    q
                )
            ) {

                ps = [
                    ...products
                ];


                if (
                    q.includes('silver')
                ) {

                    ps =
                        ps.filter(
                            product =>
                                product.material ===
                                'Silver'
                        );
                }


                if (
                    q.includes('gold')
                ) {

                    ps =
                        ps.filter(
                            product =>
                                product.material ===
                                'Gold'
                        );
                }



                const max =
                    q.match(
                        /(?:under|below|budget|less than)\s*(?:aed\s*)?(\d+)/
                    );



                if (max) {

                    ps =
                        ps.filter(
                            product =>
                                product.price <=
                                Number(max[1])
                        );
                }



                if (
                    q.includes('recent')
                ) {

                    ps.sort(
                        (a, b) =>
                            b.year -
                            a.year
                    );
                }



                empty =
                    !ps.length;



                answer =
                    empty
                        ? 'I couldn’t find a piece matching those details in this sample collection.'
                        : `I’ve selected ${
                            ps.length === 1
                                ? 'one piece'
                                : ps.length +
                                  ' pieces'
                        } for a closer look. ${
                            q.includes('silver')
                                ? 'Distinctive designs, struck in fine silver.'
                                : 'Each offers a different way into the collection.'
                        }`;

            }


            else {

                answer =
                    "I don't have enough verified information to confirm that. I can help you explore this sample collection by material or budget, compare pieces, or look at a coin’s specifications.";

            }



            const demoSessionId =
                (
                    typeof sessionId ===
                        'string' &&
                    sessionId.trim()
                )
                ||
                globalThis.crypto
                    ?.randomUUID?.()
                ||
                (
                    'demo-' +
                    Date.now() +
                    '-' +
                    Math.random()
                        .toString(36)
                        .slice(2)
                );



            return {

                answer,

                products:
                    ps,

                comparison,

                recommendation,

                empty,

                session_id:
                    demoSessionId
            };
        }



        /* =====================================================
           APP
        ====================================================== */

        let root =
            document.querySelector(
                '#biddix-app'
            );


        if (!root) {

            root =
                document.createElement(
                    'div'
                );


            root.id =
                'biddix-app';


            document.body.append(
                root
            );
        }



        /* =====================================================
           SESSION STORAGE

           IMPORTANT:

           Redis =
               server conversation storage.

           localStorage =
               only Redis session identifier.
        ====================================================== */

        const SESSION_STORAGE_KEY =
            'biddix_session_id';



        function loadSessionId() {

            try {

                const value =
                    localStorage.getItem(
                        SESSION_STORAGE_KEY
                    );


                if (
                    typeof value !==
                        'string' ||
                    value.trim() === ''
                ) {

                    return null;
                }


                return value.trim();

            }

            catch {

                return null;
            }
        }



        function saveSessionId(
            sessionId
        ) {

            if (
                typeof sessionId !==
                    'string' ||
                sessionId.trim() === ''
            ) {

                return;
            }


            try {

                localStorage.setItem(
                    SESSION_STORAGE_KEY,
                    sessionId.trim()
                );

            }

            catch {

                /*
                 * Browser may block localStorage.
                 * Current page session can still work.
                 */
            }
        }



        function clearSessionId() {

            try {

                localStorage.removeItem(
                    SESSION_STORAGE_KEY
                );

            }

            catch {

                /*
                 * Nothing else needed.
                 */
            }
        }



        /* =====================================================
           STATE
        ====================================================== */

        const state = {

            status:
                'closed',

            sessionId:
                loadSessionId(),

            messages:
                [],

            currentProduct:
                null,

            recommendedProducts:
                [],

            lastQuery:
                '',

            open:
                false,

            requestVersion:
                0
        };



        let returnFocus;

        let openingTimer;

        let previousOverflow;

        let backgroundElements =
            [];



        /* =====================================================
           CHAT HTML
        ====================================================== */

        root.innerHTML = `

            <button
                type="button"
                class="bx-trigger"
                data-action="open"
                aria-controls="concierge"
                aria-expanded="false"
            >

                <span class="bx-trigger-mark">
                    B.
                </span>

                <span>
                    <strong>
                        Biddix
                    </strong>

                    <small>
                        Product Concierge
                    </small>
                </span>

                <span
                    class="bx-live-dot"
                    aria-hidden="true"
                ></span>

            </button>


            <div
                class="bx-backdrop"
                hidden
            ></div>


            <aside
                id="concierge"
                class="bx-panel"
                role="dialog"
                aria-modal="true"
                aria-labelledby="concierge-title"
                aria-hidden="true"
                inert
            >


                <header
                    class="bx-panel-header"
                >

                    <div>

                        <strong
                            id="concierge-title"
                        >
                            Biddix
                        </strong>

                        <span>
                            Product Concierge
                        </span>

                    </div>


                    <div
                        class="bx-panel-controls"
                    >

                        <button
                            type="button"
                            data-action="minimize"
                            aria-label="Minimize concierge"
                        >
                            −
                        </button>

                        <button
                            type="button"
                            data-action="close"
                            aria-label="Close concierge"
                        >
                            ×
                        </button>

                    </div>

                </header>


                <div
                    class="bx-panel-status"
                >

                    <span>
                        <i></i>
                        Personal guidance
                    </span>

                    <span>
                        Sample collection
                    </span>

                </div>


                <div
                    id="product-context"
                ></div>


                <div
                    class="bx-feed"
                    id="feed"
                    role="log"
                    aria-label="Conversation"
                    aria-live="polite"
                ></div>


                <div
                    class="bx-composer-wrap"
                >


                    <button
                        type="button"
                        class="bx-start-over"
                        data-action="reset"
                        hidden
                    >
                        Start a new enquiry ↗
                    </button>


                    <form
                        class="bx-composer"
                    >

                        <label
                            class="bx-sr"
                            for="message"
                        >
                            Ask about the Biddix collection
                        </label>


                        <textarea
                            id="message"
                            rows="1"
                            placeholder="Ask about the Biddix collection…"
                            maxlength="2000"
                        ></textarea>


                        <button
                            type="submit"
                            aria-label="Send message"
                        >
                            ↑
                        </button>

                    </form>


                    <div
                        class="bx-composer-note"
                    >

                        <span>
                            Considered answers.
                            Exceptional finds.
                        </span>


                        <button
                            type="button"
                            data-action="demo"
                            aria-label="Open prototype state controls"
                        >
                            Demo ↗
                        </button>

                    </div>


                    <div
                        class="bx-demo-controls"
                        hidden
                    >

                        <span>
                            Preview a state
                        </span>


                        <button
                            type="button"
                            data-query="Find silver under AED 50"
                        >
                            Empty results
                        </button>


                        <button
                            type="button"
                            data-query="Simulate error"
                        >
                            Error & retry
                        </button>

                    </div>

                </div>

            </aside>
        `;



        /* =====================================================
           REFERENCES
        ====================================================== */

        const panel =
            root.querySelector(
                '.bx-panel'
            );


        const feed =
            root.querySelector(
                '#feed'
            );


        const composer =
            root.querySelector(
                '.bx-composer'
            );


        const input =
            root.querySelector(
                '#message'
            );


        const sendButton =
            composer.querySelector(
                'button[type="submit"]'
            );


        const startOverButton =
            root.querySelector(
                '.bx-start-over'
            );



        /* =====================================================
           RENDER
        ====================================================== */

        function render() {

            panel.dataset.state =
                state.status;



            root
                .querySelector(
                    '#product-context'
                )
                .innerHTML =
                    state.currentProduct
                        ? CurrentProductContext(
                            state.currentProduct
                        )
                        : '';



            feed.innerHTML =
                state.messages.length
                    ? state.messages
                        .map(
                            message =>
                                message.role ===
                                    'user'
                                    ? CustomerMessage(
                                        message.text
                                    )
                                    : ConciergeResponse(
                                        message
                                    )
                        )
                        .join('')
                    : Welcome(
                        !!state.currentProduct
                    );



            if (
                state.status ===
                    'sending' ||
                state.status ===
                    'streaming'
            ) {

                feed.insertAdjacentHTML(
                    'beforeend',
                    LoadingState()
                );
            }



            if (
                state.status ===
                'error'
            ) {

                feed.insertAdjacentHTML(
                    'beforeend',
                    ErrorState()
                );
            }



            const busy =
                [
                    'sending',
                    'streaming'
                ].includes(
                    state.status
                );



            sendButton.disabled =
                busy;


            input.disabled =
                busy;



            /*
             * Existing Redis session also counts as
             * an active enquiry even after refresh.
             */

            startOverButton.hidden =
                !state.messages.length &&
                !state.sessionId;



            startOverButton.disabled =
                busy;



            feed.scrollTop =
                feed.scrollHeight;
        }



        /* =====================================================
           OPEN
        ====================================================== */

        function open() {

            if (
                state.open
            ) {

                return;
            }



            returnFocus =
                document.activeElement;



            state.open =
                true;



            if (
                ![
                    'sending',
                    'streaming',
                    'error'
                ].includes(
                    state.status
                )
            ) {

                state.status =
                    'opening';
            }



            panel.inert =
                false;



            panel.setAttribute(
                'aria-hidden',
                'false'
            );



            panel.classList.add(
                'is-open'
            );



            root
                .querySelector(
                    '.bx-backdrop'
                )
                .hidden =
                    false;



            root
                .querySelector(
                    '.bx-trigger'
                )
                .setAttribute(
                    'aria-expanded',
                    'true'
                );



            backgroundElements =
                [];



            let branch =
                root;



            while (
                branch.parentElement &&
                branch !==
                    document.body
            ) {

                for (
                    const element
                    of branch
                        .parentElement
                        .children
                ) {

                    if (
                        element !==
                            branch &&
                        ![
                            'SCRIPT',
                            'STYLE',
                            'LINK'
                        ].includes(
                            element.tagName
                        )
                    ) {

                        backgroundElements.push(
                            [
                                element,
                                element.inert
                            ]
                        );


                        element.inert =
                            true;
                    }
                }


                branch =
                    branch.parentElement;
            }



            previousOverflow =
                document.body
                    .style
                    .overflow;



            document.body.style.overflow =
                'hidden';



            root
                .querySelector(
                    '.bx-trigger'
                )
                .hidden =
                    true;



            render();



            clearTimeout(
                openingTimer
            );



            openingTimer =
                setTimeout(
                    () => {

                        if (
                            state.status ===
                            'opening'
                        ) {

                            state.status =
                                'ready';

                            render();
                        }


                        input.focus();

                    },
                    320
                );
        }



        /* =====================================================
           CLOSE
        ====================================================== */

        function close() {

            clearTimeout(
                openingTimer
            );



            state.open =
                false;



            panel.classList.remove(
                'is-open'
            );



            panel.setAttribute(
                'aria-hidden',
                'true'
            );



            panel.inert =
                true;



            root
                .querySelector(
                    '.bx-backdrop'
                )
                .hidden =
                    true;



            root
                .querySelector(
                    '.bx-trigger'
                )
                .setAttribute(
                    'aria-expanded',
                    'false'
                );



            for (
                const [
                    element,
                    wasInert
                ]
                of backgroundElements
            ) {

                element.inert =
                    wasInert;
            }



            backgroundElements =
                [];



            document.body.style.overflow =
                previousOverflow ||
                '';



            root
                .querySelector(
                    '.bx-trigger'
                )
                .hidden =
                    false;



            if (
                state.status ===
                    'ready' ||
                state.status ===
                    'opening'
            ) {

                state.status =
                    'closed';
            }



            const focusTarget =
                (
                    returnFocus &&
                    returnFocus !==
                        document.body &&
                    document.contains(
                        returnFocus
                    )
                )
                    ? returnFocus
                    : root.querySelector(
                        '.bx-trigger'
                    );



            focusTarget?.focus();
        }



        /* =====================================================
           SUBMIT MESSAGE
        ====================================================== */

        async function submit(
            text,
            {
                retry = false
            } = {}
        ) {

            text =
                String(
                    text ||
                    ''
                ).trim();



            if (!text) {

                return;
            }



            if (
                [
                    'sending',
                    'streaming'
                ].includes(
                    state.status
                )
            ) {

                return;
            }



            open();



            state.lastQuery =
                text;



            if (!retry) {

                state.messages.push({
                    role:
                        'user',

                    text
                });
            }



            input.value =
                '';



            state.status =
                'sending';



            /*
             * Protect against an old response arriving
             * after Start New Enquiry.
             */

            const requestVersion =
                ++state.requestVersion;



            render();



            try {

                const data =
                    await sendMessage({

                        message:
                            text,

                        sessionId:
                            state.sessionId,

                        currentProduct:
                            state.currentProduct,

                        onChunk:
                            () => {

                                if (
                                    requestVersion !==
                                    state.requestVersion
                                ) {

                                    return;
                                }


                                state.status =
                                    'streaming';


                                render();
                            }
                    });



                /*
                 * User may have reset the conversation
                 * while request was running.
                 */

                if (
                    requestVersion !==
                    state.requestVersion
                ) {

                    return;
                }



                /*
                 * FIX:
                 *
                 * Never replace a valid session with
                 * undefined/null.
                 */

                if (
                    typeof data.session_id ===
                        'string' &&
                    data.session_id.trim() !==
                        ''
                ) {

                    const sessionId =
                        data.session_id
                            .trim();


                    state.sessionId =
                        sessionId;


                    saveSessionId(
                        sessionId
                    );
                }



                state.recommendedProducts =
                    Array.isArray(
                        data.products
                    )
                        ? data.products
                        : [];



                state.messages.push({

                    role:
                        'assistant',

                    ...data
                });



                state.status =
                    state.open
                        ? 'ready'
                        : 'closed';

            }

            catch (error) {

                if (
                    requestVersion !==
                    state.requestVersion
                ) {

                    return;
                }



                console.error(
                    'Biddix chat error:',
                    error
                );



                if (
                    error?.name ===
                    'AbortError'
                ) {

                    state.status =
                        state.open
                            ? 'ready'
                            : 'closed';

                }

                else {

                    state.status =
                        'error';
                }
            }



            render();



            if (
                state.open
            ) {

                input.focus();
            }
        }



        /* =====================================================
           PRODUCT
        ====================================================== */

        function product(
            id
        ) {

            const selectedProduct =
                state.recommendedProducts
                    .find(
                        product =>
                            product.id ===
                            id
                    )
                ||
                getProduct(id);



            if (
                !selectedProduct
            ) {

                return;
            }



            state.currentProduct =
                selectedProduct;



            /*
             * Open backend supplied product URL
             * when available.
             */

            if (
                selectedProduct.product_url &&
                window.BIDDIX_CONFIG?.mode ===
                    'live'
            ) {

                try {

                    const url =
                        new URL(
                            selectedProduct.product_url,
                            location.origin
                        );



                    if (
                        [
                            'http:',
                            'https:'
                        ].includes(
                            url.protocol
                        )
                    ) {

                        window.open(
                            url.href,
                            '_blank',
                            'noopener,noreferrer'
                        );


                        render();


                        return;
                    }

                }

                catch {

                    /*
                     * Invalid URL:
                     * continue to specification request.
                     */
                }
            }



            render();



            submit(
                `Show me the specifications for ${selectedProduct.name}`
            );
        }



        /* =====================================================
           RESET CONVERSATION
        ====================================================== */

        function resetConversation() {

            /*
             * Invalidate any old request.
             */

            state.requestVersion++;



            /*
             * Remove browser's Redis session identifier.
             *
             * Next request contains no session_id.
             * Backend therefore starts a fresh Redis
             * conversation.
             */

            state.sessionId =
                null;



            clearSessionId();



            state.messages =
                [];



            state.currentProduct =
                null;



            state.recommendedProducts =
                [];



            state.lastQuery =
                '';



            state.status =
                state.open
                    ? 'ready'
                    : 'closed';



            render();



            if (
                state.open
            ) {

                input.focus();
            }
        }



        /* =====================================================
           CLICK HANDLER
        ====================================================== */

        root.addEventListener(
            'click',
            event => {

                const button =
                    event.target.closest(
                        'button,a'
                    );



                if (!button) {

                    return;
                }



                /* -----------------------------------------
                   QUERY
                ----------------------------------------- */

                if (
                    button.dataset.query
                ) {

                    event.preventDefault();


                    submit(
                        button.dataset.query
                    );


                    return;
                }



                /* -----------------------------------------
                   PRODUCT
                ----------------------------------------- */

                if (
                    button.dataset.product
                ) {

                    event.preventDefault();


                    product(
                        button.dataset.product
                    );


                    return;
                }



                /* -----------------------------------------
                   FEEDBACK
                ----------------------------------------- */

                if (
                    button.dataset.feedback
                ) {

                    const feedback =
                        button.closest(
                            '.bx-feedback'
                        );


                    if (feedback) {

                        feedback.textContent =
                            button.dataset.feedback ===
                                'Yes'
                                ? 'Thank you. Your feedback is noted.'
                                : 'Thank you. Try adding a little more detail to your enquiry.';
                    }


                    return;
                }



                /* -----------------------------------------
                   ACTIONS
                ----------------------------------------- */

                switch (
                    button.dataset.action
                ) {


                    case 'open':

                        open();

                        break;



                    case 'close':

                    case 'minimize':

                        close();

                        break;



                    case 'reset':

                        resetConversation();

                        break;



                    case 'clear-context':

                        state.currentProduct =
                            null;


                        render();

                        break;



                    case 'retry':

                        submit(

                            state.lastQuery ===
                                'Simulate error'
                                ? 'Explore UAE coins'
                                : state.lastQuery,

                            {
                                retry:
                                    true
                            }
                        );

                        break;



                    case 'demo': {

                        const controls =
                            root.querySelector(
                                '.bx-demo-controls'
                            );


                        controls.hidden =
                            !controls.hidden;


                        break;
                    }

                }
            }
        );



        /* =====================================================
           FORM SUBMISSION
        ====================================================== */

        composer.addEventListener(
            'submit',
            event => {

                event.preventDefault();


                submit(
                    input.value
                );
            }
        );



        /* =====================================================
           ENTER TO SEND
        ====================================================== */

        input.addEventListener(
            'keydown',
            event => {

                if (
                    event.key ===
                        'Enter' &&
                    !event.shiftKey
                ) {

                    event.preventDefault();


                    submit(
                        input.value
                    );
                }
            }
        );



        /* =====================================================
           BACKDROP
        ====================================================== */

        root
            .querySelector(
                '.bx-backdrop'
            )
            .addEventListener(
                'click',
                close
            );



        /* =====================================================
           KEYBOARD / ACCESSIBILITY
        ====================================================== */

        document.addEventListener(
            'keydown',
            event => {

                if (
                    !state.open
                ) {

                    return;
                }



                if (
                    event.key ===
                    'Escape'
                ) {

                    event.preventDefault();


                    close();


                    return;
                }



                if (
                    event.key !==
                    'Tab'
                ) {

                    return;
                }



                const elements =
                    [
                        ...panel.querySelectorAll(
                            'button,textarea,a'
                        )
                    ]
                    .filter(
                        element =>
                            !element.disabled &&
                            element
                                .getClientRects()
                                .length
                    );



                if (
                    !elements.length
                ) {

                    return;
                }



                const first =
                    elements[0];


                const last =
                    elements[
                        elements.length - 1
                    ];



                if (
                    event.shiftKey &&
                    document.activeElement ===
                        first
                ) {

                    event.preventDefault();


                    last.focus();
                }


                else if (
                    !event.shiftKey &&
                    document.activeElement ===
                        last
                ) {

                    event.preventDefault();


                    first.focus();
                }
            }
        );



        /* =====================================================
           SHOPIFY PRODUCT CONTEXT
        ====================================================== */

        state.currentProduct =
            window.BIDDIX_CONFIG
                ?.currentProduct

            ||

            getProduct(
                window.BIDDIX_CONFIG
                    ?.currentProductId
            )

            ||

            null;



        /* =====================================================
           LIVE MODE
        ====================================================== */

        if (
            window.BIDDIX_CONFIG?.mode ===
            'live'
        ) {

            const statusText =
                root.querySelector(
                    '.bx-panel-status > span:last-child'
                );


            if (
                statusText
            ) {

                statusText.textContent =
                    'Collection guidance';
            }



            const demoButton =
                root.querySelector(
                    '[data-action="demo"]'
                );


            if (
                demoButton
            ) {

                demoButton.hidden =
                    true;
            }
        }



        /* =====================================================
           EXTERNAL PRODUCT CONTEXT
        ====================================================== */

        window.addEventListener(
            'biddix:product-context',
            event => {

                state.currentProduct =
                    event.detail?.product

                    ||

                    getProduct(
                        event.detail
                            ?.productId
                    )

                    ||

                    null;



                render();
            }
        );



        /* =====================================================
           INITIAL RENDER
        ====================================================== */

        render();



        /* =====================================================
           AUTO OPEN
        ====================================================== */

        if (
            window.BIDDIX_CONFIG
                ?.openOnLoad
        ) {

            open();
        }



    })();
    </script>
